name: Deploy Terraform - OIDC

on:
    workflow_dispatch:
        inputs:
            target_account:
                description: "Selecciona la cuenta a desplegar"
                required: true
                type: choice
                options:
                    - connectivity
                    - workloads
            terraform_action:
                description: "Acción a ejecutar"
                required: true
                default: "plan"
                type: choice
                options:
                    - plan
                    - apply
                    - destroy
                    - unlock
            lock_id:
                description: "ID de bloqueo (Solo para la opción unlock)"
                required: false
                type: string
            environmentWorkload:
                description: "Entorno para la carga de trabajo"
                required: false
                type: choice
                options:
                    - dev
                    - prod

env:
    AWS_REGION: "us-east-1"
    WORK_DIR: "accounts/${{ github.event.inputs.target_account }}"

    TF_VAR_aws_region: "us-east-1"
    TF_VAR_project_name: "aws-landing-terraform"
    TF_VAR_s3_state: ${{ secrets.S3_STATE }}

jobs:
    terraform:
        name: TF ${{ inputs.terraform_action }} on ${{ inputs.target_account }}
        runs-on: ubuntu-latest

        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform CLI
              uses: hashicorp/setup-terraform@v2
              with:
                  terraform_version: "1.15.2"

            - name: Configure AWS credentials - OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Resolve deploy role
              env:
                  IN_OUT_CIDR: ${{ vars.IN_OUT_CIDR }}
                  SPOKE_VPCS: ${{ vars.SPOKE_VPCS }}
                  WORKLOADS_ACCOUNT_IDS: ${{ secrets.WORKLOADS_ACCOUNT_IDS }}
              run: |
                  if [ "${{ inputs.target_account }}" = "connectivity" ]; then
                    echo "TF_VAR_deploy_role_arn=${{ secrets.ROLE_ARN_CONNECTIVITY }}" >> "$GITHUB_ENV"
                    {
                      echo "TF_VAR_cidr_ingress_egress<<TFEOF"
                      printf '%s\n' "$IN_OUT_CIDR"
                      echo "TFEOF"
                    } >> "$GITHUB_ENV"
                    {
                      echo "TF_VAR_spoke_vpcs<<TFEOF"
                      printf '%s\n' "$SPOKE_VPCS"
                      echo "TFEOF"
                    } >> "$GITHUB_ENV"
                    {
                      echo "TF_VAR_workloads_account_ids<<TFEOF"
                      printf '%s\n' "$WORKLOADS_ACCOUNT_IDS"
                      echo "TFEOF"
                    } >> "$GITHUB_ENV"
                  elif [ "${{ inputs.environmentWorkload }}" = "prod" ]; then
                    echo "TF_VAR_deploy_role_arn=${{ secrets.ROLE_ARN_WORKLOADS_PROD }}" >> "$GITHUB_ENV"
                  else
                    echo "TF_VAR_deploy_role_arn=${{ secrets.ROLE_ARN_WORKLOADS_DEV }}" >> "$GITHUB_ENV"
                  fi

            - name: Terraform init
              working-directory: ${{ env.WORK_DIR }}
              run: |
                  terraform init \
                    -backend-config="bucket=${{ secrets.S3_STATE }}" \
                    -backend-config="key=${{ env.WORK_DIR }}/terraform.tfstate" \
                    -backend-config="region=${{ env.AWS_REGION }}"

            - name: Select workspace
              working-directory: ${{ env.WORK_DIR }}
              if: ${{ github.event.inputs.target_account == 'workloads' }}
              run: |
                  terraform workspace select ${{ github.event.inputs.environmentWorkload }} || terraform workspace new ${{ github.event.inputs.environmentWorkload }}

            - name: Terraform Force Unlock
              if: ${{ github.event.inputs.lock_id != '' }}
              working-directory: ${{ env.WORK_DIR }}
              run: terraform force-unlock -force ${{ github.event.inputs.lock_id }}

            - name: Terraform Validate
              if: ${{ github.event.inputs.terraform_action != 'unlock' }}
              working-directory: ${{ env.WORK_DIR }}
              run: terraform validate

            - name: Terraform Plan
              if: ${{ github.event.inputs.terraform_action != 'unlock' }}
              working-directory: ${{ env.WORK_DIR }}
              run: terraform plan -out=plan.tfplan

            - name: Terraform Apply
              if: ${{ inputs.terraform_action == 'apply' }}
              working-directory: ${{ env.WORK_DIR }}
              run: terraform apply -auto-approve plan.tfplan

            - name: Terraform Destroy
              if: ${{ github.event.inputs.terraform_action == 'destroy' }}
              working-directory: ${{ env.WORK_DIR }}
              run: terraform destroy -auto-approve
